[tool.poetry]
name = "hospital-appointment-management"
version = "0.1.0"
description = "Hospital Appointment Management API"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.100.0"
uvicorn = {extras = ["standard"], version = "^0.23.0"}
SQLAlchemy = "^2.0"
pydantic = "^2.3"
alembic = "^2.1"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.0"
httpx = "^0.25"
black = "^24.3"
ruff = "^0.17"
isort = "^5.12"
pylint = "^2.17"
bandit = "^1.9"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
exclude = [".venv", "venv", "build", "dist"]

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
